name: CI

# The fast checks. They need no simulator or emulator, so they run on every pull request and on
# every push to main. The device tests are in device-tests.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request makes the run of the old commit pointless; main keeps every run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Core is a submodule; the tests and the generator read its headers.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails when the committed bindings differ from what the generator emits from Core's headers.
      - name: Generated bindings are up to date
        run: npm run generate:check

      # The spec reporter prints every test name with its result and the failure details.
      - name: Node tests
        run: npm test -- --test-reporter=spec
